; Century 2000 – PHP settings on the hosting (PHP-FPM reads this file; changes apply within ~5 minutes)
display_errors = Off
log_errors = On
expose_php = Off
; PDF catalogues up to 40 MB, photos up to 20 MB
upload_max_filesize = 40M
post_max_size = 42M
max_file_uploads = 5
; sessions: cookies only, HttpOnly, strict mode
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
